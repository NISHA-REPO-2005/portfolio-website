<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="seo-title">Nisha Yadav — B.Tech CSE Student &amp; Web Developer</title>
  <meta name="description" id="seo-description" content="Portfolio of Nisha Yadav, a B.Tech Computer Science and Engineering student at Calcutta Institute of Engineering and Management (2024–2028) passionate about web development, programming fundamentals, and building practical software solutions.">
  <meta name="theme-color" content="#1c1014">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;0,6..96,700;1,6..96,400;1,6..96,600&family=Pinyon+Script&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin.css">
  <!-- GSAP for Cinematic Page & Route Transitions -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>

  <!-- ═══════════ AMBIENT GLOWS & GRAIN OVERLAY ═══════════ -->
  <div class="ambient-glow ambient-glow-top" aria-hidden="true"></div>
  <div class="ambient-glow ambient-glow-mid" aria-hidden="true"></div>
  <div class="grain-overlay" aria-hidden="true"></div>

  <!-- ═══════════ PRELOADER (Runs on Initial Portfolio Entry) ═══════════ -->
  <div class="preloader" id="preloader">
    <div class="preloader-inner">
      <div class="preloader-text" id="preloader-name">
        <span>N</span><span>I</span><span>S</span><span>H</span><span>A</span>
        <span>&nbsp;</span>
        <span>Y</span><span>A</span><span>D</span><span>A</span><span>V</span>
      </div>
      <div class="preloader-bar">
        <div class="preloader-bar-fill" id="preloader-fill"></div>
      </div>
      <div class="preloader-counter" id="preloader-counter">0%</div>
    </div>
  </div>

  <!-- ═══════════ CUSTOM CURSOR ═══════════ -->
  <div class="cursor" id="cursor"></div>
  <div class="cursor-dot" id="cursor-dot"></div>

  <!-- ═══════════ DYNAMIC SPA APP ROOT CONTAINER ═══════════ -->
  <main id="app-root"></main>

  <!-- ═══════════ SCRIPTS ═══════════ -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
